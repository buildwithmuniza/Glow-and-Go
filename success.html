<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Confirmed | Glow & Go</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">

        <div class="logo">
            Glow & Go
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#cosmetics">Cosmetics</a>
            <a href="index.html#bags">Bags</a>
        </nav>

    </header>


    <main class="success-page">

        <div class="success-container">

            <div class="success-icon">
                ✓
            </div>

            <h1>
                Order Confirmed! 🎉
            </h1>

            <p>
                Thank you for shopping with Glow & Go 💗
            </p>

            <div class="order-number">
                Order Number:
                <strong id="orderNumber"></strong>
            </div>

            <div class="success-total">
                Total:
                <strong id="successTotal">
                    Rs. 0
                </strong>
            </div>

            <a href="index.html" class="home-button">
                Continue Shopping 🛍️
            </a>

        </div>

    </main>

    <script>
    const orderNumber =
        localStorage.getItem("glowAndGoOrderNumber");

    const orderTotal =
        localStorage.getItem("glowAndGoOrderTotal");

    document.querySelector("#orderNumber").textContent =
        orderNumber || "N/A";

    document.querySelector("#successTotal").textContent =
        "Rs. " + Number(orderTotal || 0).toLocaleString();
</script>

</body>
</html>
